<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Учет успеваемости | Консоль заместителя</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0F;
            color: #E8EAF6;
            overflow-x: hidden;
        }

        /* Dark theme with RGB violet accents */
        :root {
            --bg-primary: #0A0A0F;
            --bg-secondary: #0F0F18;
            --bg-card: #151520;
            --bg-hover: #1C1C2A;
            --border: #252535;
            --violet-light: #A855F7;
            --violet: #7C3AED;
            --violet-dark: #5B21B6;
            --violet-glow: rgba(124, 58, 237, 0.25);
            --accent-success: #10B981;
            --accent-warning: #F59E0B;
            --danger: #EF4444;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes borderGlow {
            0% { border-color: var(--violet); box-shadow: 0 0 0 0 var(--violet-glow); }
            50% { border-color: var(--violet-light); box-shadow: 0 0 0 4px var(--violet-glow); }
            100% { border-color: var(--violet); box-shadow: 0 0 0 0 var(--violet-glow); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 0px rgba(168, 85, 247, 0); }
            50% { text-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }
            100% { text-shadow: 0 0 0px rgba(168, 85, 247, 0); }
        }

        .animate-fade-in { animation: fadeInUp 0.4s ease-out; }
        .animate-slide-in { animation: slideInLeft 0.3s ease-out; }

        /* Layout */
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--violet), var(--violet-dark));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon i { font-size: 20px; color: white; }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--violet-light), var(--violet));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Global Search */
        .global-search {
            flex: 0 1 400px;
            position: relative;
        }

        .global-search input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .global-search input:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 0 3px var(--violet-glow);
            animation: borderGlow 1s ease;
        }

        .global-search i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* Profile */
        .profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .profile:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
        }

        .profile-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--violet), var(--violet-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-dropdown {
            position: absolute;
            top: 52px;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 180px;
            z-index: 200;
            animation: fadeInUp 0.2s ease;
        }

        .dropdown-item {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background: var(--bg-hover);
            padding-left: 20px;
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            flex: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--violet-glow), transparent);
            transition: width 0.3s ease;
        }

        .nav-item:hover::before { width: 100%; }
        .nav-item:hover { color: var(--text-primary); transform: translateX(4px); }

        .nav-item.active {
            background: linear-gradient(135deg, var(--violet-dark), var(--violet));
            color: white;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .nav-item i { width: 24px; font-size: 18px; }

        /* Content */
        .content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--violet);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--violet);
            padding-left: 16px;
        }

        /* Welcome Banner */
        .welcome-banner {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(91, 33, 182, 0.1));
            border: 1px solid var(--violet);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease;
        }

        .welcome-text h2 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--violet-light), var(--violet));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .welcome-text p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .welcome-stats {
            display: flex;
            gap: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--violet-light);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Hero GIF Section */
        .hero-section {
            background: linear-gradient(135deg, #0F0F1A, #0A0A0F);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 24px;
            position: relative;
            animation: fadeIn 0.6s ease;
        }

        .hero-blur-bg {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
        }

        .hero-gif {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(3px) brightness(0.7);
            transition: all 0.5s ease;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.6), rgba(124, 58, 237, 0.3));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hero-overlay h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff, var(--violet-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glowPulse 2s ease-in-out infinite;
        }

        .hero-overlay p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 600px;
        }

        .hero-overlay .btn-get-started {
            margin-top: 24px;
            background: linear-gradient(135deg, var(--violet), var(--violet-dark));
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .hero-overlay .btn-get-started:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--violet-glow);
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-select {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--violet);
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            background: var(--bg-hover);
            color: var(--violet-light);
            font-weight: 600;
            font-size: 13px;
        }

        .data-table tr {
            transition: all 0.2s;
        }

        .data-table tr:hover td {
            background: rgba(124, 58, 237, 0.1);
        }

        /* Inputs */
        .score-input {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            color: var(--text-primary);
            width: 70px;
            text-align: center;
            transition: all 0.2s;
        }

        .score-input:focus {
            outline: none;
            border-color: var(--violet);
            box-shadow: 0 0 0 2px var(--violet-glow);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--violet), var(--violet-dark));
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--violet-glow);
        }

        .btn-secondary {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: var(--violet);
            background: var(--violet-glow);
        }

        /* Badges */
        .badge-success { color: var(--accent-success); font-weight: 600; }
        .badge-danger { color: var(--danger); font-weight: 600; }
        .badge-warning { color: var(--accent-warning); font-weight: 600; }

        /* History Log */
        .history-log {
            background: var(--bg-hover);
            border-radius: 12px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .history-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: var(--bg-card);
            transform: translateX(4px);
        }

        /* Footer */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .footer-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-info i { color: var(--violet); }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .sidebar .nav-item span { display: none; }
            .sidebar .nav-item i { margin: 0 auto; }
            .global-search { flex: 1; }
            .hero-overlay h1 { font-size: 28px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-hover); }
        ::-webkit-scrollbar-thumb { background: var(--violet); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--violet-light); }

        .hidden { display: none; }
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--violet-dark);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            animation: fadeInUp 0.3s ease;
            z-index: 1000;
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // --- 10 STUDENTS MOCK DATA ---
    const STUDENTS_DATA = [
        { id: 1, name: 'Анна Кузнецова', group: 'ПИ-31', scores: { 'Веб-технологии': { attendance: 28, homework: 38, exam: 29, total: 95 }, 'Базы данных': { attendance: 27, homework: 32, exam: 25, total: 84 }, 'ООП': { attendance: 26, homework: 35, exam: 28, total: 89 } } },
        { id: 2, name: 'Иван Петров', group: 'ПИ-31', scores: { 'Веб-технологии': { attendance: 20, homework: 25, exam: 22, total: 67 }, 'Базы данных': { attendance: 22, homework: 28, exam: 20, total: 70 }, 'ООП': { attendance: 21, homework: 26, exam: 23, total: 70 } } },
        { id: 3, name: 'Мария Смирнова', group: 'ПИ-31', scores: { 'Веб-технологии': { attendance: 15, homework: 20, exam: 18, total: 53 }, 'Базы данных': { attendance: 18, homework: 22, exam: 15, total: 55 }, 'ООП': { attendance: 16, homework: 19, exam: 17, total: 52 } } },
        { id: 4, name: 'Дмитрий Зайцев', group: 'ПИ-32', scores: { 'Веб-технологии': { attendance: 25, homework: 30, exam: 24, total: 79 }, 'Базы данных': { attendance: 20, homework: 25, exam: 18, total: 63 }, 'ООП': { attendance: 22, homework: 28, exam: 22, total: 72 } } },
        { id: 5, name: 'Елена Волкова', group: 'ПИ-32', scores: { 'Веб-технологии': { attendance: 12, homework: 18, exam: 10, total: 40 }, 'Базы данных': { attendance: 14, homework: 16, exam: 12, total: 42 }, 'ООП': { attendance: 11, homework: 15, exam: 9, total: 35 } } },
        { id: 6, name: 'Сергей Морозов', group: 'ПИ-31', scores: { 'Веб-технологии': { attendance: 30, homework: 40, exam: 30, total: 100 }, 'Базы данных': { attendance: 29, homework: 38, exam: 30, total: 97 }, 'ООП': { attendance: 30, homework: 39, exam: 30, total: 99 } } },
        { id: 7, name: 'Ольга Новикова', group: 'ПИ-32', scores: { 'Веб-технологии': { attendance: 22, homework: 28, exam: 20, total: 70 }, 'Базы данных': { attendance: 24, homework: 30, exam: 22, total: 76 }, 'ООП': { attendance: 23, homework: 29, exam: 21, total: 73 } } },
        { id: 8, name: 'Алексей Федоров', group: 'ПИ-33', scores: { 'Веб-технологии': { attendance: 18, homework: 22, exam: 16, total: 56 }, 'Базы данных': { attendance: 20, homework: 24, exam: 18, total: 62 }, 'ООП': { attendance: 19, homework: 23, exam: 17, total: 59 } } },
        { id: 9, name: 'Татьяна Григорьева', group: 'ПИ-33', scores: { 'Веб-технологии': { attendance: 26, homework: 34, exam: 27, total: 87 }, 'Базы данных': { attendance: 28, homework: 35, exam: 26, total: 89 }, 'ООП': { attendance: 27, homework: 33, exam: 28, total: 88 } } },
        { id: 10, name: 'Павел Соколов', group: 'ПИ-33', scores: { 'Веб-технологии': { attendance: 14, homework: 19, exam: 12, total: 45 }, 'Базы данных': { attendance: 16, homework: 21, exam: 14, total: 51 }, 'ООП': { attendance: 15, homework: 20, exam: 13, total: 48 } } }
    ];

    let appState = {
        students: JSON.parse(JSON.stringify(STUDENTS_DATA)),
        groups: ['ПИ-31', 'ПИ-32', 'ПИ-33'],
        disciplines: ['Веб-технологии', 'Базы данных', 'ООП'],
        teachers: ['Проф. Соколова Е.А.', 'Доц. Морозов В.И.', 'Ст.преп. Лебедева М.Н.', 'Проф. Ковалев А.А.'],
        history: [],
        currentUser: { name: 'Анна Иванова', role: 'Зам. декана' },
        activePage: 'welcome',
        lastBackup: new Date().toLocaleString()
    };

    function getFinalGrade(total) {
        if (total >= 86) return 5;
        if (total >= 70) return 4;
        if (total >= 56) return 3;
        return 2;
    }

    function showNotification(msg) {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 2500);
    }

    function addHistory(action, studentName, group, discipline, field, oldVal, newVal) {
        appState.history.unshift({
            id: Date.now(),
            timestamp: new Date().toLocaleString(),
            user: appState.currentUser.name,
            action,
            studentName,
            group,
            discipline,
            field,
            oldVal,
            newVal
        });
        if (appState.history.length > 150) appState.history.pop();
        render();
    }

    function updateScore(studentId, discipline, field, value) {
        const student = appState.students.find(s => s.id === studentId);
        if (!student) return;
        const oldVal = student.scores[discipline]?.[field] || 0;
        let newVal = parseInt(value);
        if (isNaN(newVal)) newVal = 0;
        
        let maxVal = field === 'attendance' ? 30 : field === 'homework' ? 40 : 30;
        if (newVal > maxVal) newVal = maxVal;
        if (newVal < 0) newVal = 0;
        
        if (!student.scores[discipline]) {
            student.scores[discipline] = { attendance: 0, homework: 0, exam: 0, total: 0 };
        }
        student.scores[discipline][field] = newVal;
        student.scores[discipline].total = 
            (student.scores[discipline].attendance || 0) +
            (student.scores[discipline].homework || 0) +
            (student.scores[discipline].exam || 0);
        
        addHistory('Изменение оценки', student.name, student.group, discipline, 
                   field === 'attendance' ? 'Посещаемость' : field === 'homework' ? 'ДЗ/КР' : 'Экзамен',
                   oldVal, newVal);
        render();
        showNotification(`Оценка для ${student.name} обновлена`);
    }

    function addGroup(name) { if (name && !appState.groups.includes(name.trim())) { appState.groups.push(name.trim()); showNotification(`Группа "${name}" добавлена`); render(); } else if(name) alert('Группа уже существует'); }
    function removeGroup(idx) { const removed = appState.groups[idx]; appState.groups.splice(idx, 1); showNotification(`Группа "${removed}" удалена`); render(); }
    function addDiscipline(name) { if (name && !appState.disciplines.includes(name.trim())) { appState.disciplines.push(name.trim()); showNotification(`Дисциплина "${name}" добавлена`); render(); } else if(name) alert('Дисциплина уже существует'); }
    function removeDiscipline(idx) { const removed = appState.disciplines[idx]; appState.disciplines.splice(idx, 1); showNotification(`Дисциплина "${removed}" удалена`); render(); }
    function addTeacher(name) { if (name && !appState.teachers.includes(name.trim())) { appState.teachers.push(name.trim()); showNotification(`Преподаватель "${name}" добавлен`); render(); } else if(name) alert('Преподаватель уже существует'); }
    function removeTeacher(idx) { const removed = appState.teachers[idx]; appState.teachers.splice(idx, 1); showNotification(`Преподаватель "${removed}" удален`); render(); }

    function exportToExcel() {
        const group = document.getElementById('stmtGroup')?.value || appState.groups[0];
        const discipline = document.getElementById('stmtDiscipline')?.value || appState.disciplines[0];
        const studentsInGroup = appState.students.filter(s => s.group === group);
        const data = studentsInGroup.map(s => {
            const scores = s.scores[discipline] || { attendance: 0, homework: 0, exam: 0, total: 0 };
            return {
                'ФИО': s.name,
                'Посещаемость (0-30)': scores.attendance,
                'ДЗ/КР (0-40)': scores.homework,
                'Экзамен (0-30)': scores.exam,
                'Итог': scores.total,
                'Оценка': getFinalGrade(scores.total)
            };
        });
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Ведомость');
        XLSX.writeFile(wb, `vedomost_${group}_${discipline}.xlsx`);
        showNotification('Excel файл сформирован');
    }

    function createRetakeSheet() {
        const group = document.getElementById('retakeGroup')?.value || appState.groups[0];
        const studentsInGroup = appState.students.filter(s => s.group === group);
        const debtors = studentsInGroup.filter(s => {
            return Object.values(s.scores).some(score => getFinalGrade(score.total) < 3);
        });
        alert(`✅ Создана ведомость пересдачи для группы ${group}\n📋 Количество студентов: ${debtors.length}\n📝 Задолжники: ${debtors.map(s => s.name).join(', ') || 'нет'}`);
        showNotification(`Ведомость пересдачи для ${group} создана`);
    }

            Object.values(s.scores).some(score => getFinalGrade(score.total) < 3)
        ).length;
        
        return `
            <div class="hero-section animate-fade-in">

                    <img class="hero-gif" src="https://media1.tenor.com/m/WE6758Td05cAAAAC/scenery-anime.gif" 
                         alt="Welcome animation"
                         onerror="this.src='https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExaHl6bjN4aGp1eWZ2bG00dWZ2bG00dWZ2bG00dWZ2bG00dWZ2bG00dWZ2bG00&ep=v1_gifs_search&rid=200w.gif&ct=g'">
                    <div class="hero-overlay">
                        <h1> Учет успеваемости</h1>

            <div class="welcome-banner">
                <div class="welcome-text">
                    <h2><i class="fas fa-hand-wave"></i> Здравствуйте, ${appState.currentUser.name}!</h2>
                    <p>Добро пожаловать в консоль заместителя декана. Сегодня отличный день для работы!</p>
                </div>
                <div class="welcome-stats">
                    <div class="stat-item">
                        <div class="stat-value">${appState.groups.length}</div>

                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${totalStudents}</div>
                        <div class="stat-label">Студентов</div>
                    </div>
                    <div class="stat-item">

                        <div class="stat-label">Дисциплин</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${debtorsCount}</div>
                        <div class="stat-label">Должников</div>

                </div>
            </div>
            
            <div class="card">
                <div class="card-title">

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                    <div class="btn-primary" style="justify-content: center; cursor: pointer;" onclick="setPage('rating')">
                        <i class="fas fa-chart-line"></i> Управление рейтингом
                    </div>
                    <div class="btn-primary" style="justify-content: center; cursor: pointer; background: linear-gradient(135deg, #10B981, #059669);" onclick="setPage('statements')">
                        <i class="fas fa-file-alt"></i> Создать ведомость
                    </div>
                    <div class="btn-primary" style="justify-content: center; cursor: pointer; background: linear-gradient(135deg, #F59E0B, #D97706);" onclick="setPage('retake')">
                        <i class="fas fa-repeat"></i> Управление пересдачами
                    </div>
                </div>
            </div>
        `;
    }

    // Rating Page
    function renderRatingPage() {
        const selectedGroup = document.getElementById('ratingGroup')?.value || appState.groups[0];
        const selectedDiscipline = document.getElementById('ratingDiscipline')?.value || appState.disciplines[0];
        const studentsInGroup = appState.students.filter(s => s.group === selectedGroup);
        
        return `
            <div class="card animate-fade-in">
                <div class="card-title">
                    <i class="fas fa-chart-line" style="color: var(--violet-light);"></i>
                    Управление рейтингом
                </div>
                <div class="filters">
                    <select id="ratingGroup" class="filter-select" onchange="render()">
                        ${appState.groups.map(g => `<option value="${g}" ${g === selectedGroup ? 'selected' : ''}>${g}</option>`).join('')}
                    </select>
                    <select id="ratingDiscipline" class="filter-select" onchange="render()">
                        ${appState.disciplines.map(d => `<option value="${d}" ${d === selectedDiscipline ? 'selected' : ''}>${d}</option>`).join('')}
                    </select>
                    <select id="ratingTeacher" class="filter-select">
                        ${appState.teachers.map(t => `<option value="${t}">${t}</option>`).join('')}
                    </select>
                    <button class="btn-secondary" onclick="document.getElementById('historyPanel').classList.toggle('hidden')">
                        <i class="fas fa-history"></i> История правок
                    </button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr><th>Студент</th><th>Посещаемость (0-30)</th><th>ДЗ/КР (0-40)</th><th>Экзамен (0-30)</th><th>Итог</th><th>Оценка</th></tr>
                    </thead>
                    <tbody>
                        ${studentsInGroup.map(s => {
                            const scores = s.scores[selectedDiscipline] || { attendance: 0, homework: 0, exam: 0, total: 0 };
                            const grade = getFinalGrade(scores.total);
                            return `
                                <tr>
                                    <td>${s.name}</td>
                                    <td><input type="number" class="score-input" min="0" max="30" value="${scores.attendance}" onchange="updateScore(${s.id}, '${selectedDiscipline}', 'attendance', this.value)"></td>
                                    <td><input type="number" class="score-input" min="0" max="40" value="${scores.homework}" onchange="updateScore(${s.id}, '${selectedDiscipline}', 'homework', this.value)"></td>
                                    <td><input type="number" class="score-input" min="0" max="30" value="${scores.exam}" onchange="updateScore(${s.id}, '${selectedDiscipline}', 'exam', this.value)"></td>
                                    <td><strong>${scores.total}</strong></td>
                                    <td class="${grade < 3 ? 'badge-danger' : grade === 3 ? 'badge-warning' : 'badge-success'}">${grade}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
                <div id="historyPanel" class="history-log hidden">
                    <h4 style="margin-bottom: 12px;"><i class="fas fa-clock"></i> История изменений</h4>
                    ${appState.history.slice(0, 30).map(h => `
                        <div class="history-item">
                            <span style="color: var(--violet-light);">${h.timestamp}</span> | 
                            <strong>${h.user}</strong> — 
                            ${h.action}: ${h.studentName} (${h.discipline}) — ${h.field}: ${h.oldVal} → ${h.newVal}
                        </div>
                    `).join('')}
                    ${appState.history.length === 0 ? '<div class="history-item">Нет записей</div>' : ''}
                </div>
            </div>
        `;
    }

    // Statements Page (Only Excel export, no PDF/Print)
    function renderStatementsPage() {
        return `
            <div class="card animate-fade-in">
                <div class="card-title">
                    <i class="fas fa-file-alt" style="color: var(--violet-light);"></i>
                    Генератор ведомостей
                </div>
                <div class="filters">
                    <select id="controlType" class="filter-select">
                        <option value="Экзамен">Экзамен</option>
                        <option value="Диф. зачет">Диф. зачет</option>
                        <option value="Защита проектов">Защита проектов</option>
                    </select>
                    <select id="stmtGroup" class="filter-select">${appState.groups.map(g => `<option value="${g}">${g}</option>`).join('')}</select>
                    <select id="stmtDiscipline" class="filter-select">${appState.disciplines.map(d => `<option value="${d}">${d}</option>`).join('')}</select>
                    <select id="stmtTeacher" class="filter-select">${appState.teachers.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
                </div>
                <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                    <button class="btn-primary" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Экспорт в Excel</button>
                </div>
            </div>
        `;
    }

    function renderRetakePage() {
        const selectedGroup = document.getElementById('retakeGroup')?.value || appState.groups[0];
        const threshold = parseInt(document.getElementById('threshold')?.value || 56);
        const studentsInGroup = appState.students.filter(s => s.group === selectedGroup);
        
        const debtors = studentsInGroup.filter(s => {
            return Object.values(s.scores).some(score => score.total < threshold);
        });
        
        return `
            <div class="card animate-fade-in">
                <div class="card-title">
                    <i class="fas fa-repeat" style="color: var(--violet-light);"></i>
                    Доп. сессия (Пересдачи)
                </div>
                <div class="filters">
                    <select id="retakeGroup" class="filter-select" onchange="render()">${appState.groups.map(g => `<option value="${g}" ${g === selectedGroup ? 'selected' : ''}>${g}</option>`).join('')}</select>
                    <input type="number" id="threshold" class="score-input" placeholder="Порог" value="56" onchange="render()" style="width: 100px;">
                    <button class="btn-secondary" onclick="document.getElementById('threshold').value=56; render()"><i class="fas fa-filter"></i> Показать всех с баллом &lt;56</button>
                </div>
                <table class="data-table">
                    <thead><tr><th>Студент</th><th>Дисциплины-долги (балл &lt;${threshold})</th><th>Статус</th></tr></thead>
                    <tbody>
                        ${debtors.map(s => {
                            const debts = Object.entries(s.scores).filter(([_, score]) => score.total < threshold);
                            return `<tr><td>${s.name}</td><td>${debts.map(d => `${d[0]} (${d[1].total} баллов)`).join(', ') || '—'}</td><td class="badge-danger">Требуется пересдача</td></tr>`;
                        }).join('')}
                        ${debtors.length === 0 ? '<tr><td colspan="3" style="text-align: center;">✅ Нет задолжников</td></tr>' : ''}
                    </tbody>
                </table>
                <button class="btn-primary" style="margin-top: 20px;" onclick="createRetakeSheet()"><i class="fas fa-file-signature"></i> Создать ведомость пересдачи</button>
            </div>
        `;
    }

    function renderDirectoriesPage() {
        return `
            <div class="card animate-fade-in">
                <div class="card-title">
                    <i class="fas fa-book" style="color: var(--violet-light);"></i>
                    Справочники системы
                </div>
                <div style="display: grid; gap: 32px;">
                    <div><h3 style="margin-bottom: 12px;"><i class="fas fa-users"></i> Группы</h3>
                        <div class="filters"><input type="text" id="newGroup" class="score-input" placeholder="Название группы" style="width: 200px;"><button class="btn-primary" onclick="addGroup(document.getElementById('newGroup').value); document.getElementById('newGroup').value=''">+ Добавить</button></div>
                        <ul style="margin-top: 12px;">${appState.groups.map((g, i) => `<li style="padding: 8px 0; border-bottom: 1px solid var(--border);">📁 ${g} <button class="btn-secondary" style="float: right; padding: 2px 8px;" onclick="removeGroup(${i})">Удалить</button></li>`).join('')}</ul>
                    </div>
                    <div><h3 style="margin-bottom: 12px;"><i class="fas fa-chalkboard-user"></i> Преподаватели</h3>
                        <div class="filters"><input type="text" id="newTeacher" class="score-input" placeholder="ФИО преподавателя" style="width: 250px;"><button class="btn-primary" onclick="addTeacher(document.getElementById('newTeacher').value); document.getElementById('newTeacher').value=''">+ Добавить</button></div>
                        <ul style="margin-top: 12px;">${appState.teachers.map((t, i) => `<li style="padding: 8px 0; border-bottom: 1px solid var(--border);">👩‍🏫 ${t} <button class="btn-secondary" style="float: right; padding: 2px 8px;" onclick="removeTeacher(${i})">Удалить</button></li>`).join('')}</ul>
                    </div>
                    <div><h3 style="margin-bottom: 12px;"><i class="fas fa-book-open"></i> Дисциплины</h3>
                        <div class="filters"><input type="text" id="newDiscipline" class="score-input" placeholder="Дисциплина" style="width: 200px;"><button class="btn-primary" onclick="addDiscipline(document.getElementById('newDiscipline').value); document.getElementById('newDiscipline').value=''">+ Добавить</button></div>
                        <ul style="margin-top: 12px;">${appState.disciplines.map((d, i) => `<li style="padding: 8px 0; border-bottom: 1px solid var(--border);">📘 ${d} <button class="btn-secondary" style="float: right; padding: 2px 8px;" onclick="removeDiscipline(${i})">Удалить</button></li>`).join('')}</ul>
                    </div>
                </div>
            </div>
        `;
    }

    function render() {
        const pages = {
            welcome: renderWelcomePage(),
            rating: renderRatingPage(),
            statements: renderStatementsPage(),
            retake: renderRetakePage(),
            directories: renderDirectoriesPage()
        };
        
        document.getElementById('app').innerHTML = `
            <div class="app">
                <header class="header">
                    <div class="logo" onclick="setPage('welcome')"><div class="logo-icon"><i class="fas fa-graduation-cap"></i></div><span class="logo-text">АИС Успеваемость</span></div>
                    <div class="global-search"><i class="fas fa-search"></i><input type="text" placeholder="Поиск: студент, группа, дисциплина..." id="globalSearchInput" onkeyup="globalSearch(this.value)"></div>
                    <div class="profile" id="profileBtn"><div class="profile-avatar"><i class="fas fa-user-shield"></i></div><span>${appState.currentUser.name}</span><i class="fas fa-chevron-down"></i><div class="profile-dropdown" id="profileDropdown" style="display: none;"><div class="dropdown-item"><i class="fas fa-user-cog"></i> Настройки</div><div class="dropdown-item"><i class="fas fa-key"></i> Смена пароля</div><div class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Выход</div></div></div>
                </header>
                <div class="main-layout">
                    <aside class="sidebar">
                        <div class="nav-item ${appState.activePage === 'welcome' ? 'active' : ''}" onclick="setPage('welcome')"><i class="fas fa-home"></i><span>Главная</span></div>
                        <div class="nav-item ${appState.activePage === 'rating' ? 'active' : ''}" onclick="setPage('rating')"><i class="fas fa-chart-line"></i><span>База рейтинга</span></div>
                        <div class="nav-item ${appState.activePage === 'statements' ? 'active' : ''}" onclick="setPage('statements')"><i class="fas fa-file-alt"></i><span>Генератор ведомостей</span></div>
                        <div class="nav-item ${appState.activePage === 'retake' ? 'active' : ''}" onclick="setPage('retake')"><i class="fas fa-repeat"></i><span>Реестр пересдач</span></div>
                        <div class="nav-item ${appState.activePage === 'directories' ? 'active' : ''}" onclick="setPage('directories')"><i class="fas fa-book"></i><span>Справочники</span></div>
                    </aside>
                    <main class="content">${pages[appState.activePage]}</main>
                </div>
                <footer class="footer">
                    <div class="footer-info"><i class="fas fa-users"></i> Групп в системе: ${appState.groups.length}</div>
                    <div class="footer-info"><i class="fas fa-database"></i> Последний бэкап: ${appState.lastBackup}</div>
                    <div class="footer-info"><i class="fas fa-shield-alt"></i> АИС Учета успеваемости v2.0</div>
                </footer>
            </div>
        `;
        
        document.getElementById('profileBtn')?.addEventListener('click', (e) => {
            e.stopPropagation();
            const dropdown = document.getElementById('profileDropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        });
        document.addEventListener('click', () => {
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown) dropdown.style.display = 'none';
        });
    }
    
    function setPage(page) { appState.activePage = page; render(); }
    
    function globalSearch(term) {
        if (term.length < 2) return;
        const foundStudent = appState.students.find(s => s.name.toLowerCase().includes(term.toLowerCase()));
        const foundGroup = appState.groups.find(g => g.toLowerCase().includes(term.toLowerCase()));
        const foundDiscipline = appState.disciplines.find(d => d.toLowerCase().includes(term.toLowerCase()));
        if (foundStudent) alert(`🔍 Найден студент: ${foundStudent.name}\n📚 Группа: ${foundStudent.group}`);
        else if (foundGroup) alert(`🔍 Найдена группа: ${foundGroup}`);
        else if (foundDiscipline) alert(`🔍 Найдена дисциплина: ${foundDiscipline}`);
    }
    
    window.updateScore = updateScore;
    window.addGroup = addGroup;
    window.removeGroup = removeGroup;
    window.addDiscipline = addDiscipline;
    window.removeDiscipline = removeDiscipline;
    window.addTeacher = addTeacher;
    window.removeTeacher = removeTeacher;
    window.exportToExcel = exportToExcel;
    window.setPage = setPage;
    window.globalSearch = globalSearch;
    window.render = render;
    window.createRetakeSheet = createRetakeSheet;
    
    render();
</script>
</body>
</html>
